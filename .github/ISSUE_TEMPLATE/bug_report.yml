name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start JhatPat\n2. Scan the QR code with the phone\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JhatPat version
      description: "Laptop: output of `jhatpat -version`. Android app: the version shown in Settings → Apps → JhatPat."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Which host are you using?
      options: ["Laptop: Windows", "Laptop: macOS", "Laptop: Linux", "Android app"]
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and browser (or the host phone, for the Android app)
      placeholder: "Pixel 8, Chrome 130"
  - type: textarea
    id: doctor
    attributes:
      label: Network Doctor result
      description: If the problem is connecting on a laptop, click the status pill at the top of the page and paste what it says. Not available in the Android app.
