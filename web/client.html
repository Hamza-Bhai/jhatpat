<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>JhatPat ⚡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="/static/css/sunnypop.css">
<script src="/static/js/common.js"></script>
<script src="/static/js/i18n.js"></script>
<script>JP.theme.init();</script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo">⚡ JhatPat <small id="me"></small></div>
    <div class="row">
      <button class="btn small iconbtn" data-theme-btn title="Light / Dark"></button>
    </div>
  </header>

  <div class="shell" id="shell">
    <div class="tobar">
      <label for="target" data-i18n="to_label"></label>
      <select id="target"></select>
    </div>
    <div class="chat" id="chat">
      <div class="chat-empty" id="empty"><span class="big">👋</span><span data-i18n="chat_empty"></span></div>
      <div id="feed" style="display:contents"></div>
      <div id="pending" style="display:contents"></div>
    </div>
    <div class="composer">
      <button class="btn roundbtn yellow" id="attachBtn" data-i18n-title="attach" aria-label="Send files">📎</button>
      <button class="btn roundbtn yellow hidden" id="folderBtn" aria-label="Send a folder">📁</button>
      <textarea id="text" rows="1" data-i18n-ph="type_msg"></textarea>
      <button class="btn roundbtn primary" id="sendText" aria-label="Send">➤</button>
    </div>
  </div>
  <input type="file" id="fileInput" multiple class="hidden">
  <input type="file" id="folderInput" webkitdirectory multiple class="hidden">

  <section class="card center hidden" id="kickedView" style="margin:10px">
    <div style="font-size:60px">👋</div>
    <h2 data-i18n="kicked"></h2>
    <button class="btn primary" onclick="location.replace('/')" data-i18n="reload"></button>
  </section>
</div>
<script src="/static/js/client.js"></script>
</body>
</html>
